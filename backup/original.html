<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User API Form</title>

    <link rel="stylesheet" href="../KAYOMBO/bootstrap-5.0.2-dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow p-4">
        <h3 id="formTitle" class="text-center mb-4">User Registration</h3>

        <form id="userForm">
            <input type="hidden" id="userId">

            <div class="mb-3">
                <label class="form-label">Full Name</label>
                <input type="text" id="name" class="form-control" placeholder="Enter name" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" id="email" class="form-control" placeholder="Enter email" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Phone Number</label>
                <input type="text" id="phoneNo" class="form-control" placeholder="Enter phone number" required>
            </div>

            <div id="formActions">
                <button type="submit" id="submitBtn" class="btn btn-primary w-100">Register Now</button>
            </div>
        </form>

        <div id="message" class="mt-3"></div>

       <!-- <hr class="my-5">
        <h4 class="text-center mb-3">Registered Users</h4>
        <table class="table table-striped table-bordered mt-3">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Phone Number</th>
                    <th class="text-center">Actions</th> 
                </tr>
            </thead>
            <tbody id="userTableBody">
            </tbody>
        </table>
    </div>
</div>-->

<script>
// Helper function to show a message that disappears after 4 seconds
function displayAlert(text, type) {
    const messageDiv = document.getElementById("message");
    messageDiv.innerHTML = `
        <div class="alert alert-${type}">
            ${text}
        </div>
    `;
    setTimeout(() => {
        messageDiv.innerHTML = "";
    }, 4000);
}

// Function to fetch and display users in the table
async function fetchUsers() {
    try {
        const response = await fetch("http://localhost:3000/api/users");
        const users = await response.json();
        
        const tableBody = document.getElementById("userTableBody");
        tableBody.innerHTML = ""; // Clear old data

        users.forEach(user => {
            tableBody.innerHTML += `
                <tr id="row-${user.id}">
                    <td>${user.id}</td>
                    <td>${user.name}</td>
                    <td>${user.email}</td>
                    <td>${user.phoneNo}</td>
                    <td class="text-center">
                        <button class="btn btn-warning btn-sm me-2" onclick="startEdit(${user.id}, '${user.name}', '${user.email}', '${user.phoneNo}')">
                            Edit
                        </button>
                        <button class="btn btn-danger btn-sm" onclick="deleteUser(${user.id})">
                            Delete
                        </button>
                    </td>
                </tr>
            `;
        });
    } catch (error) {
        console.error("Error fetching users:", error);
    }
}

// Function to switch the form into Edit Mode
function startEdit(id, name, email, phoneNo) {
    document.getElementById("userId").value = id;
    document.getElementById("name").value = name;
    document.getElementById("email").value = email;
    document.getElementById("phoneNo").value = phoneNo;

    document.getElementById("formTitle").innerText = "Update User Details";
    
    // Replace single submit button with Update & Cancel options
    document.getElementById("formActions").innerHTML = `
        <div class="row">
            <div class="col-md-8">
                <button type="submit" class="btn btn-info text-white w-100">Update User</button>
            </div>
            <div class="col-md-4">
                <button type="button" class="btn btn-secondary w-100" onclick="resetFormState()">Cancel</button>
            </div>
        </div>
    `;

    // Highlight the row currently being modified
    document.querySelectorAll("#userTableBody tr").forEach(r => r.classList.remove("table-info"));
    document.getElementById(`row-${id}`).classList.add("table-info");
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

// Function to restore the form back to its default Register Mode
function resetFormState() {
    document.getElementById("userForm").reset();
    document.getElementById("userId").value = "";
    document.getElementById("formTitle").innerText = "User Registration";
    document.getElementById("formActions").innerHTML = `<button type="submit" class="btn btn-primary w-100">Submit</button>`;
    document.querySelectorAll("#userTableBody tr").forEach(r => r.classList.remove("table-info"));
}

// Function to handle deleting a user
async function deleteUser(id) {
    const targetRow = document.getElementById(`row-${id}`);
    if (targetRow) targetRow.classList.add("table-danger");

    if (confirm("Are you sure you want to delete this user?")) {
        try {
            const response = await fetch(`http://localhost:3000/api/users/${id}`, {
                method: "DELETE"
            });
            const data = await response.json();

            if (response.ok) {
                displayAlert(data.message, "success");
                fetchUsers(); 
            } else {
                displayAlert(data.message, "danger");
                if (targetRow) targetRow.classList.remove("table-danger");
            }
        } catch (error) {
            displayAlert("Error connecting to server. Make sure API is running.", "danger");
            if (targetRow) targetRow.classList.remove("table-danger");
        }
    } else {
        if (targetRow) targetRow.classList.remove("table-danger");
    }
}

// Unified form submission managing both creating (POST) and updating (PUT)
document.getElementById("userForm").addEventListener("submit", async function(e) {
    e.preventDefault();

    const id = document.getElementById("userId").value;
    const name = document.getElementById("name").value;
    const email = document.getElementById("email").value;
    const phoneNo = document.getElementById("phoneNo").value;

    // Determine strategy based on presence of a user ID tracking value
    const isEditing = id !== "";
    const targetUrl = isEditing ? `http://localhost:3000/api/users/${id}` : "http://localhost:3000/api/users";
    const targetMethod = isEditing ? "PUT" : "POST";

    try {
        const response = await fetch(targetUrl, {
            method: targetMethod,
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ name, email, phoneNo })
        });

        const data = await response.json();

        if (response.ok) {
            displayAlert(data.message, "success");
            resetFormState();
            fetchUsers(); 
        } else {
            displayAlert(data.message, "danger");
        }

    } catch (error) {
        displayAlert("Server error. Make sure API is running.", "danger");
    }
});

// Automatically fetch user array on page initialization
window.onload = fetchUsers;
</script>

</body>
</html>
