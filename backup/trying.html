<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kiganjani Motors - Order System</title>

<link rel="stylesheet" href="KAYOMBO/bootstrap-5.0.2-dist/css/bootstrap.min.css">
<link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

<style>
.sidebar {
  width: 220px;
  position: fixed;
  height: 100%;
  background: #111;
  color: white;
  transition: 0.3s;
}
.sidebar.collapsed {
  width: 0;
  overflow: hidden;
}
.content {
  margin-left: 220px;
  transition: 0.3s;
}
.content.full {
  margin-left: 0;
}
.nav-link {
  color: white;
  padding: 10px;
  display: block;
}
.nav-link:hover {
  background: #198754;
}
.modal {
  display: none;
  position: fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background: rgba(0,0,0,0.6);
  justify-content:center;
  align-items:center;
}
</style>

</head>
<body>

<!-- SIDEBAR -->
<div id="sidebar" class="sidebar p-2">
  <div class="text-center py-3">
    <img src="IMAGES/logo.png" width="80">
    <h5 class="text-success">KM</h5>
  </div>

  <a href="#" class="nav-link"><i class="bi bi-house"></i> Home</a>
  <a href="#" class="nav-link"><i class="bi bi-info-circle"></i> About</a>
</div>

<!-- CONTENT -->
<div id="content" class="content">

<!-- TOP BAR -->
<nav class="navbar navbar-dark bg-dark p-2">
  <button class="btn btn-outline-success" onclick="toggleSidebar()">☰</button>
  <h4 class="text-success m-auto">Kiganjani Motors</h4>
</nav>

<!-- HERO -->
<section class="text-white text-center p-5" style="background:url('IMAGES/top_nav.jpg') center/cover;">
  <h1>Drive Your Dream Car</h1>
  <p>Affordable • Reliable • Trusted</p>
</section>

<!-- CARS -->
<section class="container py-5">
<h2 class="text-center mb-4">Available Cars</h2>

<div class="row">

  <!-- CAR 1 -->
  <div class="col-md-4">
    <div class="card mb-4">
      <img src="IMAGES/sedan2.jpg" class="card-img-top">
      <div class="card-body text-center">
        <h5>Mitsubishi Lancer Evo</h5>
        <p>$8,500</p>
        <button class="btn btn-success w-100"
        onclick="openOrderForm('Mitsubishi Lancer Evo',8500)">Order Now</button>
      </div>
    </div>
  </div>

  <!-- CAR 2 -->
  <div class="col-md-4">
    <div class="card mb-4">
      <img src="IMAGES/suv2.jpg" class="card-img-top">
      <div class="card-body text-center">
        <h5>Range Rover</h5>
        <p>$12,000</p>
        <button class="btn btn-success w-100"
        onclick="openOrderForm('Range Rover',12000)">Order Now</button>
      </div>
    </div>
  </div>

  <!-- CAR 3 -->
  <div class="col-md-4">
    <div class="card mb-4">
      <img src="IMAGES/sports car1.jpg" class="card-img-top">
      <div class="card-body text-center">
        <h5>Ferrari 296 GTP</h5>
        <p>$18,500</p>
        <button class="btn btn-success w-100"
        onclick="openOrderForm('Ferrari 296 GTP',18500)">Order Now</button>
      </div>
    </div>
  </div>

</div>
</section>

<!-- CONTACT -->
<section class="text-center bg-light p-4">
  <h4>Contact Us</h4>
  <p>📍 Mbeya, Tanzania</p>
  <p class="text-success">+255 782 303 971</p>
</section>

<footer class="bg-dark text-white text-center p-3">
© 2026 Kiganjani Motors
</footer>

</div>

<!-- ORDER MODAL -->
<div id="orderModal" class="modal">
  <div class="bg-white p-4 rounded" style="width:350px;">
    <h5>Place Order</h5>

    <p id="carInfo"></p>

    <input class="form-control mb-2" id="name" placeholder="Full Name">
    <input class="form-control mb-2" id="phone" placeholder="Phone">
    <input class="form-control mb-2" id="email" placeholder="Email">
    <input class="form-control mb-2" id="location" placeholder="Location">

    <button class="btn btn-success w-100" onclick="submitOrder()">Submit Order</button>
    <button class="btn btn-secondary w-100 mt-2" onclick="closeOrderForm()">Cancel</button>
  </div>
</div>

<!-- SCRIPT -->
<script>
let selectedCar = "";
let selectedPrice = 0;

function toggleSidebar(){
  document.getElementById("sidebar").classList.toggle("collapsed");
  document.getElementById("content").classList.toggle("full");
}

function openOrderForm(car, price){
  selectedCar = car;
  selectedPrice = price;

  document.getElementById("carInfo").innerText =
    "Car: " + car + " | Price: $" + price;

  document.getElementById("orderModal").style.display = "flex";
}

function closeOrderForm(){
  document.getElementById("orderModal").style.display = "none";
}

function submitOrder(){
  const order = {
    car: selectedCar,
    price: selectedPrice,
    name: document.getElementById("name").value,
    phone: document.getElementById("phone").value,
    email: document.getElementById("email").value,
    location: document.getElementById("location").value
  };

  console.log("ORDER:", order);

  alert("Order submitted successfully!");

  // READY FOR BACKEND CONNECTION:
  /*
  fetch("http://localhost:3000/api/orders", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify(order)
  });
  */

  closeOrderForm();
}
</script>

</body>
</html>
